name: Fault-Keeper Sovereign CI Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade Pip & Core Tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Runtime & Development Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Fault-Keeper (Editable Mode)
        run: |
          pip install -e . --no-deps

      - name: Pre-Flight Syntax & Bytecode Compilation Check
        run: |
          python -m compileall src tests -q

      - name: Verify CLI Subcommands & Help Flags
        run: |
          python fault_keeper.py --help
          python fault_keeper.py audit --help
          python fault_keeper.py test-audit --help
          python fault_keeper.py diagnose --help
          python fault_keeper.py solve-merge --help

      - name: Execute Deterministic Pytest Suite (Zero Warnings)
        run: |
          python -m pytest -v --tb=short
